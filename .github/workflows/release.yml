name: Release TrackOwl

on:
  push:
    tags:
      - 'v*' # Triggers when you push a version tag like v1.2.7 or v1.3.0
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event_name }}" == "push" ] || [ "${{ github.event.inputs.platform }}" == "all" ]; then
            echo 'matrix=[{"platform":"macos-latest","args":"--target aarch64-apple-darwin"},{"platform":"macos-latest","args":"--target x86_64-apple-darwin"},{"platform":"windows-latest","args":""}]' >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.platform }}" == "windows" ]; then
            echo 'matrix=[{"platform":"windows-latest","args":""}]' >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.platform }}" == "macos" ]; then
            echo 'matrix=[{"platform":"macos-latest","args":"--target aarch64-apple-darwin"},{"platform":"macos-latest","args":"--target x86_64-apple-darwin"}]' >> $GITHUB_OUTPUT
          fi

  publish:
    needs: setup-matrix
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust Targets (macOS Universal)
        if: matrix.platform == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Setup Apple API Key (macOS Notarization)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p ${{ runner.temp }}/private_keys
          cat << 'EOF' | tr -d '\r' > ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
          ${{ secrets.APPLE_API_KEY_CONTENT }}
          EOF

      # Build & Publish Release via tauri-action (no signCommand — signing done below)
      - name: Build & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing key config
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          # Apple Code Signing & Notarization config (macOS only)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
        with:
          tagName: v__VERSION__
          releaseName: 'TrackOwl v__VERSION__'
          releaseBody: |
            TrackOwl v__VERSION__ — Desktop App Release.
            
            This release packages TrackOwl for both Windows and macOS platforms.
            - **Windows**: `.exe` and `.msi` installers.
            - **macOS**: `.dmg` Disk Image and `.app` bundles (including signature files for the auto-updater).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Extract version number from package.json for manual workflow_dispatch triggers
      - name: Extract Version Number
        if: matrix.platform == 'windows-latest'
        id: version
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          echo "NUM=$ver" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Sign Windows Installers with SSL.com eSigner
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          $VERSION = "${{ steps.version.outputs.NUM }}"
          $NSIS_EXE = "${{ github.workspace }}\src-tauri\target\release\bundle\nsis\TrackOwl_${VERSION}_x64-setup.exe"
          $MSI_FILE = "${{ github.workspace }}\src-tauri\target\release\bundle\msi\TrackOwl_${VERSION}_x64_en-US.msi"

          # Download and extract CodeSignTool
          $CST_URL = "https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.0/CodeSignTool-v1.3.0-windows.zip"
          $CST_ZIP = "${{ runner.temp }}\CodeSignTool.zip"
          $CST_DIR = "${{ runner.temp }}\CodeSignTool"
          Invoke-WebRequest -Uri $CST_URL -OutFile $CST_ZIP
          Expand-Archive -Path $CST_ZIP -DestinationPath $CST_DIR -Force
          $CST_BAT = Get-ChildItem -Path $CST_DIR -Recurse -Filter "CodeSignTool.bat" | Select-Object -First 1

          if (-not $CST_BAT) {
            Write-Error "CodeSignTool.bat not found after extraction"
            exit 1
          }

          Write-Host "CodeSignTool found at: $($CST_BAT.FullName)"

          # Set CODE_SIGN_TOOL_PATH so the bat file can find its bundled JDK and jar
          $env:CODE_SIGN_TOOL_PATH = $CST_BAT.DirectoryName
          Write-Host "CODE_SIGN_TOOL_PATH set to: $env:CODE_SIGN_TOOL_PATH"

          # List contents to verify JDK and jar are present
          Write-Host "CodeSignTool directory contents:"
          Get-ChildItem -Path $env:CODE_SIGN_TOOL_PATH | ForEach-Object { Write-Host "  $_" }

          # Sign each file
          foreach ($file in @($NSIS_EXE, $MSI_FILE)) {
            if (Test-Path $file) {
              Write-Host "Signing: $file"
              & $CST_BAT.FullName sign `
                -username="$env:ES_USERNAME" `
                -password="$env:ES_PASSWORD" `
                -credential_id="$env:CREDENTIAL_ID" `
                -totp_secret="$env:ES_TOTP_SECRET" `
                -input_file_path="$file" `
                -override
              if ($LASTEXITCODE -ne 0) {
                Write-Error "Signing failed for $file with exit code $LASTEXITCODE"
                exit 1
              }
              Write-Host "Successfully signed: $file"
            } else {
              Write-Warning "File not found, skipping: $file"
            }
          }

      # Regenerate Tauri updater .sig files after code signing
      # Code signing modifies the .exe binary, invalidating the original .sig
      - name: Regenerate Updater Signatures After Code Signing
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $VERSION = "${{ steps.version.outputs.NUM }}"
          $NSIS_EXE = "${{ github.workspace }}\src-tauri\target\release\bundle\nsis\TrackOwl_${VERSION}_x64-setup.exe"
          $SIG_FILE = "${NSIS_EXE}.sig"

          if (Test-Path $NSIS_EXE) {
            Write-Host "Regenerating .sig for signed .exe..."
            # Delete old .sig
            if (Test-Path $SIG_FILE) { Remove-Item $SIG_FILE }
            # Generate new .sig using Tauri signer
            npx tauri signer sign "$NSIS_EXE" --private-key "$env:TAURI_SIGNING_PRIVATE_KEY" --password "$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            if (Test-Path $SIG_FILE) {
              Write-Host "New .sig generated successfully: $SIG_FILE"
            } else {
              Write-Error ".sig file was not generated!"
              exit 1
            }
          } else {
            Write-Warning "NSIS exe not found: $NSIS_EXE"
          }

      # Re-upload the signed Windows installers + new .sig to the GitHub release
      - name: Upload Signed Windows Installers to Release
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/release/bundle/nsis/TrackOwl_${{ steps.version.outputs.NUM }}_x64-setup.exe
            src-tauri/target/release/bundle/nsis/TrackOwl_${{ steps.version.outputs.NUM }}_x64-setup.exe.sig
            src-tauri/target/release/bundle/msi/TrackOwl_${{ steps.version.outputs.NUM }}_x64_en-US.msi

  publish-latest-json:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Generate latest.json
        run: node .github/workflows/generate_latest_json.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload latest.json to Release
        uses: softprops/action-gh-release@v1
        with:
          files: latest.json

  publish-appstore:
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos'
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Add Rust Target
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
        
      - name: Install Frontend Dependencies
        run: npm ci
        
      - name: Install Apple Certificates & Profile
        env:
          MAC_APP_CERT: ${{ secrets.MAC_APP_CERTIFICATE }}
          MAC_APP_PASSWORD: ${{ secrets.MAC_APP_CERTIFICATE_PASSWORD }}
          MAC_INSTALLER_CERT: ${{ secrets.MAC_INSTALLER_CERTIFICATE }}
          MAC_INSTALLER_PASSWORD: ${{ secrets.MAC_INSTALLER_CERTIFICATE_PASSWORD }}
          MAC_PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/appstore.keychain-db
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          # CRITICAL: Add the custom keychain to the search list so codesign can find it
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security default-keychain -s $KEYCHAIN_PATH
          
          # Install OpenSSL 3 to handle modern PKCS12 files
          brew install openssl@3 || true
          OPENSSL3_BIN=$(brew --prefix openssl@3)/bin/openssl
          
          # Import Mac App Distribution Certificate (Cert + Key)
          node -e "require('fs').writeFileSync('app_cert.p12', Buffer.from(process.env.MAC_APP_CERT.replace(/\s+/g, ''), 'base64'))"
          if [ ! -s app_cert.p12 ]; then echo "Error: app_cert.p12 is empty." && exit 1; fi
          $OPENSSL3_BIN pkcs12 -in app_cert.p12 -nodes -passin pass:"$MAC_APP_PASSWORD" -out app_cert.pem
          /usr/bin/openssl pkcs12 -export -in app_cert.pem -out app_cert_legacy.p12 -passout pass:"$MAC_APP_PASSWORD"
          security import app_cert_legacy.p12 -k $KEYCHAIN_PATH -P "$MAC_APP_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          
          # Import Mac Installer Distribution Certificate (Cert ONLY, to avoid duplicate private key error)
          node -e "require('fs').writeFileSync('inst_cert.p12', Buffer.from(process.env.MAC_INSTALLER_CERT.replace(/\s+/g, ''), 'base64'))"
          if [ ! -s inst_cert.p12 ]; then echo "Error: inst_cert.p12 is empty." && exit 1; fi
          $OPENSSL3_BIN pkcs12 -in inst_cert.p12 -nokeys -passin pass:"$MAC_INSTALLER_PASSWORD" -out inst_cert.pem
          /usr/bin/openssl pkcs12 -export -in inst_cert.pem -nokeys -out inst_cert_legacy.p12 -passout pass:"$MAC_INSTALLER_PASSWORD"
          security import inst_cert_legacy.p12 -k $KEYCHAIN_PATH -P "$MAC_INSTALLER_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" $KEYCHAIN_PATH
          
          # Install Provisioning Profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          node -e "require('fs').writeFileSync(process.env.HOME + '/Library/MobileDevice/Provisioning Profiles/profile.provisionprofile', Buffer.from(process.env.MAC_PROFILE.replace(/\s+/g, ''), 'base64'))"
          
      - name: Extract Certificate Identities
        run: |
          node -e "
            const crypto = require('crypto');
            const fs = require('fs');
            function getCN(pemFile) {
              const pem = fs.readFileSync(pemFile);
              const cert = new crypto.X509Certificate(pem);
              const cnParts = cert.subject.split('\n').find(l => l.startsWith('CN='));
              return cnParts ? cnParts.substring(3) : '';
            }
            const appCN = getCN('app_cert.pem');
            const instCN = getCN('inst_cert.pem');
            console.log('App Identity: ' + appCN);
            console.log('Installer Identity: ' + instCN);
            fs.appendFileSync(process.env.GITHUB_ENV, 'APPLE_SIGNING_IDENTITY=' + appCN + '\n');
            fs.appendFileSync(process.env.GITHUB_ENV, 'INSTALLER_SIGNING_IDENTITY=' + instCN + '\n');
          "

      - name: Build App Store App Bundle
        env:
          # VITE_APP_STORE=true tells the frontend to disable the updater UI
          # (Apple Guideline 2.4.5 vii — no self-updating in MAS apps)
          VITE_APP_STORE: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target universal-apple-darwin --bundles app --features app-store
        
      - name: Embed Provisioning Profile & Re-Sign
        run: |
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/profile.provisionprofile"
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/TrackOwl.app"
          # Use the App Store-specific entitlements which:
          #   - omits network.server (no local listening socket — Guideline 2.4.5(i))
          #   - omits allow-jit / disable-library-validation (not MAS-safe)
          ENTITLEMENTS_PATH="src-tauri/Entitlements.AppStore.plist"
          
          # Embed profile
          cp "$PROFILE_PATH" "$APP_PATH/Contents/embedded.provisionprofile"
          
          # Extract Team ID and App ID from provisioning profile
          security cms -D -i "$PROFILE_PATH" > profile.plist
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print Entitlements:com.apple.application-identifier" profile.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" profile.plist)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print Entitlements:com.apple.developer.team-identifier" profile.plist)
          
          echo "Extracted App ID: $APP_ID"
          echo "Extracted Team ID: $TEAM_ID"
          
          # Inject application-identifier and team-identifier into App Store entitlements
          /usr/libexec/PlistBuddy -c "Add :com.apple.application-identifier string $APP_ID" "$ENTITLEMENTS_PATH" || true
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string $TEAM_ID" "$ENTITLEMENTS_PATH" || true
          
          # Re-sign the inner executable to strip Tauri's default entitlements
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --entitlements "$ENTITLEMENTS_PATH" --options runtime "$APP_PATH/Contents/MacOS/TrackOwl"
          
          # Re-sign the outer bundle using the App Store entitlements
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --entitlements "$ENTITLEMENTS_PATH" --options runtime "$APP_PATH"
          # Verify the entitlements
          echo "==== OUTER BUNDLE ENTITLEMENTS ===="
          codesign -d --entitlements :- "$APP_PATH"
          echo "==== INNER EXECUTABLE ENTITLEMENTS ===="
          codesign -d --entitlements :- "$APP_PATH/Contents/MacOS/TrackOwl"
          
      - name: Create Mac App Store PKG
        run: |
          xcrun productbuild --component "src-tauri/target/universal-apple-darwin/release/bundle/macos/TrackOwl.app" /Applications TrackOwl.pkg --sign "$INSTALLER_SIGNING_IDENTITY"
          mkdir -p pkg-output
          mv TrackOwl.pkg pkg-output/
        
      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppStore-PKG
          path: pkg-output/*.pkg
