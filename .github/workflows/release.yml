name: Release TrackOwl

on:
  push:
    tags:
      - 'v*' # Triggers when you push a version tag like v1.2.7 or v1.3.0

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust Targets (macOS Universal)
        if: matrix.platform == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Setup Apple API Key (macOS Notarization)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p ${{ runner.temp }}/private_keys
          cat << 'EOF' | tr -d '\r' > ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
          ${{ secrets.APPLE_API_KEY_CONTENT }}
          EOF

      # Build & Publish Release via tauri-action
      - name: Build & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing key config
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          
          # Apple Code Signing & Notarization config (macOS only)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
        with:
          tagName: v__VERSION__ # Uses package.json version automatically
          releaseName: 'TrackOwl v__VERSION__'
          releaseBody: |
            TrackOwl v__VERSION__ — Desktop App Release.
            
            This release packages TrackOwl for both Windows and macOS platforms.
            - **Windows**: `.exe` and `.msi` installers.
            - **macOS**: `.dmg` Disk Image and `.app` bundles (including signature files for the auto-updater).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  publish-latest-json:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Generate latest.json
        run: node .github/workflows/generate_latest_json.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload latest.json to Release
        uses: softprops/action-gh-release@v1
        with:
          files: latest.json

  publish-appstore:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Add Rust Target
        run: rustup target add aarch64-apple-darwin
        
      - name: Install Frontend Dependencies
        run: npm ci
        
      - name: Install Apple Certificates & Profile
        env:
          MAC_APP_CERT: ${{ secrets.MAC_APP_CERTIFICATE }}
          MAC_APP_PASSWORD: ${{ secrets.MAC_APP_CERTIFICATE_PASSWORD }}
          MAC_INSTALLER_CERT: ${{ secrets.MAC_INSTALLER_CERTIFICATE }}
          MAC_INSTALLER_PASSWORD: ${{ secrets.MAC_INSTALLER_CERTIFICATE_PASSWORD }}
          MAC_PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/appstore.keychain-db
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          
          # Install OpenSSL 3 to handle modern PKCS12 files
          brew install openssl@3 || true
          OPENSSL3_BIN=$(brew --prefix openssl@3)/bin/openssl
          
          # Import Mac App Distribution Certificate
          node -e "require('fs').writeFileSync('app_cert.p12', Buffer.from(process.env.MAC_APP_CERT.replace(/\s+/g, ''), 'base64'))"
          if [ ! -s app_cert.p12 ]; then echo "Error: app_cert.p12 is empty." && exit 1; fi
          $OPENSSL3_BIN pkcs12 -in app_cert.p12 -nodes -passin pass:"$MAC_APP_PASSWORD" -out app_cert.pem
          /usr/bin/openssl pkcs12 -export -in app_cert.pem -out app_cert_legacy.p12 -passout pass:"$MAC_APP_PASSWORD"
          security import app_cert_legacy.p12 -k $KEYCHAIN_PATH -P "$MAC_APP_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild || true
          
          # Import Mac Installer Distribution Certificate
          node -e "require('fs').writeFileSync('inst_cert.p12', Buffer.from(process.env.MAC_INSTALLER_CERT.replace(/\s+/g, ''), 'base64'))"
          if [ ! -s inst_cert.p12 ]; then echo "Error: inst_cert.p12 is empty." && exit 1; fi
          $OPENSSL3_BIN pkcs12 -in inst_cert.p12 -nodes -passin pass:"$MAC_INSTALLER_PASSWORD" -out inst_cert.pem
          /usr/bin/openssl pkcs12 -export -in inst_cert.pem -out inst_cert_legacy.p12 -passout pass:"$MAC_INSTALLER_PASSWORD"
          security import inst_cert_legacy.p12 -k $KEYCHAIN_PATH -P "$MAC_INSTALLER_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild || true
          
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" $KEYCHAIN_PATH
          
          # Install Provisioning Profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          node -e "require('fs').writeFileSync(process.env.HOME + '/Library/MobileDevice/Provisioning Profiles/profile.provisionprofile', Buffer.from(process.env.MAC_PROFILE.replace(/\s+/g, ''), 'base64'))"
          
      - name: Build App Store App Bundle
        env:
          APPLE_SIGNING_IDENTITY: "3rd Party Mac Developer Application"
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles app
        
      - name: Create Mac App Store PKG
        run: |
          xcrun productbuild --component "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/TrackOwl.app" /Applications TrackOwl.pkg --sign "3rd Party Mac Developer Installer"
          mkdir -p pkg-output
          mv TrackOwl.pkg pkg-output/
        
      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppStore-PKG
          path: pkg-output/*.pkg
