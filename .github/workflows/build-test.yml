name: Build Test Installers

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build for testing'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event.inputs.platform }}" == "all" ]; then
            echo 'matrix=[{"platform":"macos-latest","target_name":"macos-arm64","args":"--target aarch64-apple-darwin"},{"platform":"macos-latest","target_name":"macos-x64","args":"--target x86_64-apple-darwin"},{"platform":"windows-latest","target_name":"windows-x64","args":""}]' >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.platform }}" == "windows" ]; then
            echo 'matrix=[{"platform":"windows-latest","target_name":"windows-x64","args":""}]' >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.platform }}" == "macos" ]; then
            echo 'matrix=[{"platform":"macos-latest","target_name":"macos-arm64","args":"--target aarch64-apple-darwin"},{"platform":"macos-latest","target_name":"macos-x64","args":"--target x86_64-apple-darwin"}]' >> $GITHUB_OUTPUT
          fi

  build:
    needs: setup-matrix
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust Targets (macOS Universal)
        if: matrix.platform == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Setup Apple API Key (macOS Notarization)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p ${{ runner.temp }}/private_keys
          cat << 'EOF' | tr -d '\r' > ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
          ${{ secrets.APPLE_API_KEY_CONTENT }}
          EOF

      # Build via tauri-action without publishing to GitHub releases
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
        with:
          tagName: test-build
          releaseName: 'Test Build'
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

      - name: Extract Version Number
        id: version
        run: |
          node -e "const v = require('./src-tauri/tauri.conf.json').version; console.log('NUM=' + v); require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'NUM=' + v + '\n')"

      # Code-sign Windows binaries
      - name: Sign Windows Installers with SSL.com eSigner
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          $VERSION = "${{ steps.version.outputs.NUM }}"
          $NSIS_EXE = "${{ github.workspace }}\src-tauri\target\release\bundle\nsis\TrackOwl_${VERSION}_x64-setup.exe"
          $MSI_FILE = "${{ github.workspace }}\src-tauri\target\release\bundle\msi\TrackOwl_${VERSION}_x64_en-US.msi"

          $CST_URL = "https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.0/CodeSignTool-v1.3.0-windows.zip"
          $CST_ZIP = "${{ runner.temp }}\CodeSignTool.zip"
          $CST_DIR = "${{ runner.temp }}\CodeSignTool"
          Invoke-WebRequest -Uri $CST_URL -OutFile $CST_ZIP
          Expand-Archive -Path $CST_ZIP -DestinationPath $CST_DIR -Force
          $CST_BAT = Get-ChildItem -Path $CST_DIR -Recurse -Filter "CodeSignTool.bat" | Select-Object -First 1

          if ($CST_BAT) {
            $env:CODE_SIGN_TOOL_PATH = $CST_BAT.DirectoryName
            foreach ($file in @($NSIS_EXE, $MSI_FILE)) {
              if (Test-Path $file) {
                Write-Host "Signing: $file"
                & $CST_BAT.FullName sign `
                  -username="$env:ES_USERNAME" `
                  -password="$env:ES_PASSWORD" `
                  -credential_id="$env:CREDENTIAL_ID" `
                  -totp_secret="$env:ES_TOTP_SECRET" `
                  -input_file_path="$file" `
                  -override
              }
            }
          }

      # Upload Windows installer as a GitHub Actions Artifact for testing
      - name: Upload Windows Test Artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: TrackOwl-v${{ steps.version.outputs.NUM }}-Windows-Test-Installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14

      # Upload macOS installer (.dmg) as a GitHub Actions Artifact for testing
      - name: Upload macOS Test Artifacts
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: TrackOwl-v${{ steps.version.outputs.NUM }}-${{ matrix.target_name }}-Test-Installer
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 14
